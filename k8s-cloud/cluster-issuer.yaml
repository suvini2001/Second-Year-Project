# Let's Encrypt proves you own the domain by fetching a file over http:// (the HTTP-01 challenge).
# cert-manager creates a temporary Ingress for that file, then renews the certificate before it expires.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
