events {}

http {
  # For the n8n editor's WebSocket connection (used in location / below)
  map $http_upgrade $connection_upgrade { default upgrade; "" ""; }

  server {
    listen 80;

    # n8n MCP Server Trigger: production (/mcp/...) and test (/mcp-test/...) URLs
    location ~ ^/(mcp|mcp-test)/ {
      proxy_pass http://n8n:5678;
      proxy_http_version 1.1;          # needed for streaming responses
      proxy_set_header Connection "";   # keep the upstream connection open
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;             # THE fix: send each event at once
      proxy_cache off;
      gzip off;                        # gzip also holds data back
      chunked_transfer_encoding off;   # recommended by n8n for its MCP endpoint
      proxy_read_timeout 1h;           # allow long-lived streams
    }

    # DocOp's own MCP server
    location = /docop-mcp {
      proxy_pass http://mcp-server:3001/mcp;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_buffering off;
      proxy_cache off;
      gzip off;
      proxy_read_timeout 1h;
    }

    # Everything else: n8n editor and webhooks (the editor uses WebSockets)
    location / {
      proxy_pass http://n8n:5678;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}