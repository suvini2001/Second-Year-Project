name: CI

on:
  push:
    branches: [kubernetes, main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint

  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # The suites that pass reliably today. Add the others once they are fixed (see the plan, Step 8).
      - run: npm test -- --ci

  test-mcp-server:
    name: MCP server checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci
      - run: node --check src/index.js && node --check src/tools.js && node --check src/docop.js

  validate-k8s:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -ignore-missing-schemas k8s/*.yaml

  build-push:
    name: Build and push (${{ matrix.app }})
    needs: [lint, test-backend, test-mcp-server, validate-k8s]
    if: github.event_name == 'push'          # pull requests are checked, never pushed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                        # lets GITHUB_TOKEN push to ghcr.io
    strategy:
      matrix:
        include:
          - app: backend
            build_args: ""
          - app: mcp-server
            build_args: ""
          - app: frontend
            build_args: |
              VITE_BACKEND_URL=http://docop.localhost
              VITE_BASE_PATH=/
          - app: admin
            build_args: |
              VITE_BACKEND_URL=http://docop.localhost
              VITE_BASE_PATH=/admin/
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/docop-${{ matrix.app }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
