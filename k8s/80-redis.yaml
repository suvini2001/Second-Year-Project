apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: docop
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      enableServiceLinks: false
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--save", "", "--appendonly", "no"]   # pub/sub only, nothing to persist
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: docop
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis