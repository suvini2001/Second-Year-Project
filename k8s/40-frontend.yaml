apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: docop
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      enableServiceLinks: false
      containers:
        - name: frontend
          image: ghcr.io/suvini2001/docop-frontend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "3"]
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: docop
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
