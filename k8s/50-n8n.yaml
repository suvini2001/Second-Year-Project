apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-data
  namespace: docop
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: docop
  labels:
    app: n8n
spec:
  replicas: 1                    # n8n's normal mode runs as ONE instance (scaling needs queue mode)
  strategy:
    type: Recreate               # never two n8n pods at once on the same volume and schedules
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      # Without this, the Service called "n8n" injects N8N_PORT=tcp://10.x.x.x:5678 into the pod,
      # and n8n reads N8N_PORT as its own setting and fails to start.
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        fsGroup: 1000            # lets the "node" user write to the volume
      containers:
        - name: n8n
          image: n8nio/n8n:2.39.6
          ports:
            - name: http
              containerPort: 5678
          env:
            - { name: N8N_PORT, value: "5678" }
            - { name: DB_TYPE, value: postgresdb }
            - { name: DB_POSTGRESDB_HOST, value: postgres }
            - { name: DB_POSTGRESDB_DATABASE, value: n8n }
            - { name: DB_POSTGRESDB_USER, value: n8n }
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom: { secretKeyRef: { name: docop-secrets, key: N8N_DB_PASSWORD } }
            - name: N8N_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: docop-secrets, key: N8N_ENCRYPTION_KEY } }
            - name: DOCOP_WEBHOOK_SECRET
              valueFrom: { secretKeyRef: { name: docop-secrets, key: DOCOP_WEBHOOK_SECRET } }
            - name: DOCOP_INTERNAL_KEY
              valueFrom: { secretKeyRef: { name: docop-secrets, key: DOCOP_INTERNAL_KEY } }
            - name: DOCOP_API_URL
              valueFrom: { configMapKeyRef: { name: docop-config, key: DOCOP_API_URL } }
            - { name: GENERIC_TIMEZONE, value: Asia/Colombo }
            - { name: TZ, value: Asia/Colombo }
            - { name: EXECUTIONS_DATA_PRUNE, value: "true" }
            - { name: EXECUTIONS_DATA_MAX_AGE, value: "168" }
            - { name: N8N_DIAGNOSTICS_ENABLED, value: "false" }
            - { name: N8N_PERSONALIZATION_ENABLED, value: "false" }
            - { name: N8N_BLOCK_ENV_ACCESS_IN_NODE, value: "false" }
            # public address, used for webhook and MCP URLs shown in the editor
            - { name: N8N_HOST, value: n8n.docop.localhost }
            - { name: N8N_PROTOCOL, value: http }
            - { name: WEBHOOK_URL, value: "http://n8n.docop.localhost/" }
            - { name: N8N_PROXY_HOPS, value: "1" }
            - { name: N8N_SECURE_COOKIE, value: "false" }   # local HTTP only; remove when you add HTTPS
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
          startupProbe:              # first start runs database migrations: allow up to 5 minutes
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:            # checks the database connection too
            httpGet: { path: /healthz/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n-data
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: docop
spec:
  selector:
    app: n8n
  ports:
    - name: http
      port: 5678
      targetPort: http
