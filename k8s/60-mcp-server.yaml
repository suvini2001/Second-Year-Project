apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: docop
  labels:
    app: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: mcp-server
          image: ghcr.io/suvini2001/docop-mcp-server:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - { name: PORT, value: "3001" }
            - name: DOCOP_API_URL
              valueFrom: { configMapKeyRef: { name: docop-config, key: DOCOP_API_URL } }
            - name: DOCOP_MCP_KEY
              valueFrom: { secretKeyRef: { name: docop-secrets, key: DOCOP_MCP_KEY } }
            - name: MCP_ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: docop-secrets, key: MCP_ADMIN_TOKEN } }
            - name: MCP_ASSISTANT_TOKEN
              valueFrom: { secretKeyRef: { name: docop-secrets, key: MCP_ASSISTANT_TOKEN } }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
---
# ClusterIP only: not on the Ingress. n8n reaches it inside the cluster;
# Claude Desktop reaches it with "kubectl port-forward" (see K8S.md).
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  namespace: docop
spec:
  selector:
    app: mcp-server
  ports:
    - name: http
      port: 3001
      targetPort: http
